<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Sécurité : la page ne peut charger que ses propres fichiers. Aucun appel vers internet. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Savoir si j'ai assez d'argent pour payer, et quels billets et pièces donner.">
<title>J'ai assez d'argent ?</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <ol class="steps" aria-label="Étapes">
    <li id="s1">1. Mon argent</li>
    <li id="s2">2. Le prix</li>
    <li id="s3">3. Réponse</li>
  </ol>

  <!-- Écran 1 : Mon argent -->
  <section id="v1" aria-labelledby="t1">
    <h1 id="t1" tabindex="-1">Mon argent</h1>
    <p class="help">Touche les billets et les pièces que tu as.</p>
    <p class="total" aria-live="polite">J'ai : <b id="tot">0 €</b></p>
    <h2 class="sec">Les billets</h2>
    <div class="grid notes" id="gN"></div>
    <h2 class="sec">Les pièces en euros</h2>
    <div class="grid" id="gE"></div>
    <h2 class="sec">Les petites pièces (centimes)</h2>
    <div class="grid" id="gC"></div>
  </section>

  <!-- Écran 2 : Le prix -->
  <section id="v2" class="hide" aria-labelledby="t2">
    <h1 id="t2" tabindex="-1">Le prix</h1>
    <p class="help">Écris le prix.</p>
    <p class="price" id="pr" aria-live="polite" aria-atomic="true">0 <small>€</small></p>
    <div class="pad" id="pad"></div>
  </section>

  <!-- Écran 3 : Réponse -->
  <section id="v3" class="hide" aria-label="Réponse"><div id="res"></div></section>
</main>

<nav class="bar" aria-label="Boutons"><div class="in" id="bar"></div></nav>

<script src="js/monnaie.js"></script>
<script src="js/app.js"></script>
</body>
</html>
