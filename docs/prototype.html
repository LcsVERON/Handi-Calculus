<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J'ai assez d'argent ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calme, direct, une seule chose à la fois (FALC)
   IDEA: un porte-monnaie posé sur la table, puis l'étiquette du prix, puis la réponse
   PICTURE: les vraies pièces et billets dessinés, gros, à toucher
   COLOUR and TYPE: blanc, encre sombre, bleu pour agir ; vert = oui, rouge = non ; Atkinson Hyperlegible
   LAYOUT: une colonne, 3 étapes, gros bouton en bas */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121417);--card:light-dark(#f2f4f7,#1e2228);--ink:light-dark(#111418,#f3f5f7);--soft:light-dark(#4a5260,#b8c0cc);--act:light-dark(#1450d2,#5b8cff);--actInk:#fff;--yes:light-dark(#0f7a32,#3fc46b);--yesBg:light-dark(#e3f6e9,#12301d);--no:light-dark(#b3122a,#ff6b7f);--noBg:light-dark(#fde6e9,#3a1419)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.4 "Atkinson Hyperlegible",Verdana,sans-serif;overflow-x:clip}
main{max-width:640px;margin:0 auto;padding:16px 16px 140px}
.steps{display:flex;gap:8px;margin:0 0 14px}
.steps span{flex:1;text-align:center;padding:8px 4px;border-radius:12px;background:var(--card);color:var(--soft);font-size:16px;font-weight:700}
.steps span.on{background:var(--act);color:var(--actInk)}
h1{font-size:34px;line-height:1.1;margin:6px 0 4px}
p.help{margin:0 0 14px;color:var(--soft)}
.total{font-size:26px;font-weight:700;margin:10px 0 14px;padding:12px 16px;border-radius:16px;background:var(--card)}
.total b{font-size:34px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid.notes{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:10px}
.cell{position:relative;background:var(--card);border-radius:16px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cell button.add{all:unset;cursor:pointer;display:block;width:100%;text-align:center;border-radius:12px}
.cell button.add:focus-visible,button:focus-visible{outline:4px solid var(--act);outline-offset:3px}
.cell svg{display:block;margin:0 auto;max-width:100%;height:auto}
.badge{position:absolute;top:4px;right:6px;min-width:40px;height:40px;padding:0 8px;border-radius:20px;background:var(--act);color:var(--actInk);font-weight:700;font-size:22px;display:none;align-items:center;justify-content:center}
.badge.show{display:flex}
.minus{width:100%;height:44px;border:0;border-radius:10px;background:var(--bg);color:var(--ink);font:700 26px/1 inherit;cursor:pointer}
.minus:disabled{opacity:.25}
.sec{font-size:18px;font-weight:700;color:var(--soft);margin:16px 0 8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.big{flex:1;min-height:68px;border:0;border-radius:18px;background:var(--act);color:var(--actInk);font:700 26px/1 inherit;cursor:pointer}
.ghost{min-height:68px;padding:0 18px;border:3px solid var(--soft);border-radius:18px;background:transparent;color:var(--ink);font:700 20px/1 inherit;cursor:pointer}
.big:disabled{opacity:.35}
.price{font-size:56px;font-weight:700;text-align:center;padding:18px 10px;border-radius:20px;background:var(--card);margin:6px 0 14px;white-space:nowrap;letter-spacing:.02em}
.price small{font-size:30px;color:var(--soft)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pad button{height:72px;border:0;border-radius:16px;background:var(--card);color:var(--ink);font:700 34px/1 inherit;cursor:pointer}
.pad button:active{background:var(--act);color:var(--actInk)}
.answer{border-radius:24px;padding:22px 18px;text-align:center;margin:6px 0 16px}
.answer.yes{background:var(--yesBg);color:var(--yes)}
.answer.no{background:var(--noBg);color:var(--no)}
.answer .sign{font-size:84px;line-height:1;font-weight:700}
.answer h1{font-size:44px;margin:6px 0}
.answer p{margin:4px 0;font-size:24px;color:var(--ink)}
.answer p b{white-space:nowrap}
.give{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:14px;background:var(--card);border-radius:18px}
.say{margin:14px auto 0;display:block;min-height:52px;padding:0 20px;border-radius:14px;border:3px solid currentColor;background:transparent;color:inherit;font:700 20px/1 inherit;cursor:pointer}
.hide{display:none}
@media (prefers-reduced-motion:no-preference){.answer{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<main>
  <div class="steps" aria-hidden="true"><span id="s1">1. Mon argent</span><span id="s2">2. Le prix</span><span id="s3">3. Réponse</span></div>

  <section id="v1">
    <h1>Mon argent</h1>
    <p class="help">Touche les billets et les pièces que tu as.</p>
    <div class="total">J'ai : <b id="tot">0 €</b></div>
    <div class="sec">Les billets</div>
    <div class="grid notes" id="gN"></div>
    <div class="sec">Les pièces en euros</div>
    <div class="grid" id="gE"></div>
    <div class="sec">Les petites pièces (centimes)</div>
    <div class="grid" id="gC"></div>
  </section>

  <section id="v2" class="hide">
    <h1>Le prix</h1>
    <p class="help">Écris le prix.</p>
    <div class="price" id="pr">0 <small>€</small></div>
    <div class="pad" id="pad"></div>
  </section>

  <section id="v3" class="hide"><div id="res"></div></section>
</main>

<div class="bar"><div class="in" id="bar"></div></div>

<script>
{
const D=[20000,10000,5000,2000,1000,500,200,100,50,20,10,5,2,1];
const NOTE={500:'#8e9196',1000:'#d2463c',2000:'#3b6fc4',5000:'#e98a2b',10000:'#3d9a5b',20000:'#d9b52c'};
let w={};D.forEach(d=>w[d]=0);
let price='',view=1;
try{const s=JSON.parse(localStorage.getItem('wallet')||'null');if(s)D.forEach(d=>w[d]=s[d]|0)}catch(e){}
const save=()=>{try{localStorage.setItem('wallet',JSON.stringify(w))}catch(e){}};
const eur=c=>{const e=Math.floor(c/100),r=c%100;return r?e+','+String(r).padStart(2,'0')+' €':e+' €'};
const lab=d=>d>=100?(d/100)+' €':d+' c';

function pic(d,sc=1){
  if(d>=500){const W=150*sc,H=78*sc,c=NOTE[d];
    return `<svg width="${W}" height="${H}" viewBox="0 0 150 78" role="img" aria-label="billet de ${d/100} euros"><rect x="2" y="2" width="146" height="74" rx="8" fill="${c}"/><rect x="2" y="2" width="146" height="74" rx="8" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="3"/><circle cx="118" cy="39" r="22" fill="rgba(255,255,255,.28)"/><text x="16" y="54" font-family="Atkinson Hyperlegible,Verdana" font-weight="700" font-size="40" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width="1">${d/100}</text><text x="118" y="49" text-anchor="middle" font-family="Atkinson Hyperlegible,Verdana" font-weight="700" font-size="28" fill="#fff">€</text></svg>`}
  const r={200:40,100:37,50:38,20:35,10:31,5:34,2:30,1:26}[d]*sc;
  const S=2*r+6,cx=S/2;let inner;
  if(d===200)inner=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="#c9ccd1"/><circle cx="${cx}" cy="${cx}" r="${r*.7}" fill="#d9b44a"/>`;
  else if(d===100)inner=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="#d9b44a"/><circle cx="${cx}" cy="${cx}" r="${r*.7}" fill="#c9ccd1"/>`;
  else if(d>=10)inner=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="#e0b84e"/>`;
  else inner=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="#b8693a"/>`;
  const t=d>=100?d/100+'€':d+'c',fs=Math.max(13,r*(t.length>2?.62:.78));
  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" role="img" aria-label="pièce de ${lab(d)}">${inner}<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="2.5"/><text x="${cx}" y="${cx+fs*.36}" text-anchor="middle" font-family="Atkinson Hyperlegible,Verdana" font-weight="700" font-size="${fs}" fill="#1b1b1b">${t}</text></svg>`;
}

function cell(d){return `<div class="cell"><span class="badge" id="b${d}"></span><button class="add" data-add="${d}" aria-label="ajouter ${lab(d)}">${pic(d,d>=500?.95:1)}</button><button class="minus" data-min="${d}" aria-label="enlever ${lab(d)}">−</button></div>`}
gN.innerHTML=[500,1000,2000,5000,10000,20000].map(cell).join('');
gE.innerHTML=[100,200].map(cell).join('');
gC.innerHTML=[50,20,10,5,2,1].map(cell).join('');

const total=()=>D.reduce((s,d)=>s+d*w[d],0);
function drawWallet(){
  D.forEach(d=>{const b=document.getElementById('b'+d);b.textContent='×'+w[d];b.classList.toggle('show',w[d]>0);document.querySelector(`[data-min="${d}"]`).disabled=!w[d]});
  tot.textContent=eur(total());save();
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-add]'),m=e.target.closest('[data-min]');
  if(a){w[a.dataset.add]++;drawWallet()}
  if(m&&w[m.dataset.min]>0){w[m.dataset.min]--;drawWallet()}
});

// clavier du prix
const keys=['1','2','3','4','5','6','7','8','9',',','0','⌫'];
pad.innerHTML=keys.map(k=>`<button data-k="${k}" aria-label="${k==='⌫'?'effacer':k}">${k}</button>`).join('');
pad.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;
  if(k==='⌫')price=price.slice(0,-1);
  else if(k===','){if(!price.includes(','))price=(price||'0')+','}
  else{const dec=price.split(',')[1];if(dec!==undefined&&dec.length>=2)return;if(price==='0')price='';if(price.replace(',','').length>=6)return;price+=k}
  drawPrice()});
const cents=()=>{if(!price)return 0;const[e,c='']=price.split(',');return (parseInt(e||'0',10)*100)+parseInt((c+'00').slice(0,2),10)};
function drawPrice(){pr.innerHTML=(price||'0')+' <small>€</small>';drawBar()}

// meilleur choix : peu de rendu de monnaie et peu de pièces
function choose(p){
  const T=total();if(T<p)return null;
  // DP par type de pièce : cur[s] = nombre minimal de pièces/billets pour faire s centimes
  const INF=1e9,layers=[];let cur=new Int32Array(T+1).fill(INF);cur[0]=0;
  D.forEach(d=>{const n=w[d],nx=cur.slice(),ch=new Uint8Array(T+1);
    if(n)for(let s=0;s<=T;s++){if(cur[s]>=INF)continue;for(let c=1;c<=n&&s+c*d<=T;c++){const v=cur[s]+c;if(v<nx[s+c*d]){nx[s+c*d]=v;ch[s+c*d]=c}}}
    layers.push(ch);cur=nx});
  // score = monnaie rendue (en euros) + nombre de pièces/billets donnés
  let best=-1,score=Infinity;
  for(let s=p;s<=T;s++){if(cur[s]>=INF)continue;const sc=(s-p)/100+cur[s];if(sc<score){score=sc;best=s}}
  const give={};let s=best;
  for(let i=D.length-1;i>=0;i--){const c=layers[i][s];if(c){give[D[i]]=c;s-=c*D[i]}}
  return{give,sum:best};
}

let lastText='';
function drawResult(){
  const p=cents(),r=choose(p);
  if(!r){const miss=p-total();
    lastText=`Non. Tu n'as pas assez d'argent. Il manque ${eur(miss).replace(' €',' euros')}.`;
    res.innerHTML=`<div class="answer no"><div class="sign" aria-hidden="true">✗</div><h1>NON</h1><p>Tu n'as pas assez d'argent.</p><p>Il manque : <b>${eur(miss)}</b></p><button class="say" id="say">Écouter</button></div>`;
  }else{const back=r.sum-p;
    const items=Object.keys(r.give).map(Number).sort((a,b)=>b-a).flatMap(d=>Array(r.give[d]).fill(d));
    lastText='Oui. Tu as assez d\'argent. Donne : '+items.map(d=>d>=500?'un billet de '+d/100+' euros':'une pièce de '+(d>=100?d/100+' euro'+(d>100?'s':''):d+' centime'+(d>1?'s':''))).join(', ')+'.'+(back?' Le vendeur te rend '+eur(back).replace(' €',' euros')+'.':'');
    res.innerHTML=`<div class="answer yes"><div class="sign" aria-hidden="true">✓</div><h1>OUI</h1><p>Tu as assez d'argent.</p><button class="say" id="say">Écouter</button></div>
      <div class="sec">Donne au vendeur :</div><div class="give">${items.map(d=>pic(d,d>=500?.8:.9)).join('')}</div>
      <p class="help" style="margin-top:12px">${back?`Le vendeur te rend : <b style="color:var(--ink);white-space:nowrap">${eur(back)}</b>`:'C\'est le compte juste.'}</p>`;
  }
  document.getElementById('say').onclick=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lastText);u.lang='fr-FR';u.rate=.9;speechSynthesis.speak(u)}catch(e){}};
}

function drawBar(){
  if(view===1)bar.innerHTML=`<button class="ghost" id="clr">Vider</button><button class="big" id="go" ${total()?'':'disabled'}>Suivant →</button>`;
  if(view===2)bar.innerHTML=`<button class="ghost" id="back">←</button><button class="big" id="go" ${cents()?'':'disabled'}>Vérifier</button>`;
  if(view===3)bar.innerHTML=`<button class="ghost" id="back">←</button><button class="big" id="go">Nouveau prix</button>`;
}
bar.addEventListener('click',e=>{const id=e.target.id;
  if(id==='clr'){D.forEach(d=>w[d]=0);drawWallet();drawBar()}
  if(id==='go'){if(view===1)show(2);else if(view===2)show(3);else{price='';drawPrice();show(2)}}
  if(id==='back')show(view-1);
});
document.addEventListener('click',e=>{if(view===1&&e.target.closest('.cell'))drawBar()});

function show(n){view=n;[v1,v2,v3].forEach((v,i)=>v.classList.toggle('hide',i+1!==n));
  [s1,s2,s3].forEach((s,i)=>s.classList.toggle('on',i+1===n));
  if(n===3)drawResult();drawBar();window.scrollTo(0,0)}

drawWallet();drawPrice();show(1);
}
</script>
</body>
</html>
