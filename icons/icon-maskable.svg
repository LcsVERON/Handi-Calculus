<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>J'ai assez d'argent ?</title>
  <!-- Fond bleu plein (Android découpe la forme). Le dessin reste dans le cercle central de 80 %. -->
  <rect width="512" height="512" fill="#1450d2"/>
  <!-- Pièce dorée avec le signe euro -->
  <circle cx="220" cy="240" r="135" fill="#f2c94c" stroke="#b8892a" stroke-width="14"/>
  <path d="M 278 172 A 92 92 0 1 0 278 308" fill="none" stroke="#6b4e0e" stroke-width="30" stroke-linecap="round"/>
  <path d="M 104 214 H 232 M 104 266 H 232" stroke="#6b4e0e" stroke-width="24" stroke-linecap="round"/>
  <!-- Coche verte : « oui, tu as assez » -->
  <circle cx="340" cy="340" r="72" fill="#0f7a32" stroke="#ffffff" stroke-width="14"/>
  <path d="M 305 342 L 331 368 L 377 314" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
